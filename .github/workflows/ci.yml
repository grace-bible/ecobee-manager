name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: pip install -e '.[dev]'
      - name: Lint
        run: ruff check app tests
      - name: Tests
        # Fake ecobee backend, SQLite, no Google: nothing real is touched.
        run: pytest -q

  docker:
    runs-on: ubuntu-latest
    needs: check
    permissions:
      contents: read
      # Lets GITHUB_TOKEN push to GHCR. No registry secret to manage.
      packages: write
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ecobee
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ecobee
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ecobee" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Work out the image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # Push to main → `main` + sha; a v* tag → semver tags and `latest`.
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
          flavor: latest=auto

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: ecobee-manager:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Container starts against Postgres, migrates, and serves
        # Fake backend + dev auth so the UI and API can be fetched without
        # Cloudflare or ecobee. Proves the migrations run on a real Postgres.
        run: |
          docker run -d --name app --network host \
            -e ENVIRONMENT=ci -e ECOBEE_BACKEND=fake \
            -e ALLOWED_EMAIL_DOMAINS=example.org -e DEV_AUTH_EMAIL=ci@example.org -e ADMIN_EMAILS=ci@example.org \
            -e APP_SECRET_KEY=8m2WkS3vJ1nqv2kBv9jXf4dP0yq6m5pYJ3r9VQ7b0cE= \
            -e DATABASE_URL=postgresql+psycopg://ecobee:ci@127.0.0.1:5432/ecobee \
            ecobee-manager:ci
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8000/healthz > /dev/null && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/healthz || { docker logs app; exit 1; }
          sleep 3  # first poll runs at boot
          curl -fsS http://127.0.0.1:8000/ | grep -q 'GBC Thermostats' \
            || { echo "UI did not render"; docker logs app; exit 1; }
          n=$(curl -fsS http://127.0.0.1:8000/api/v1/thermostats | python3 -c 'import json,sys;print(len(json.load(sys.stdin)))')
          [ "$n" = "6" ] || { echo "expected 6 fake thermostats, got $n"; docker logs app; exit 1; }
          curl -fsS http://127.0.0.1:8000/static/app.css > /dev/null \
            || { echo "static assets missing"; docker logs app; exit 1; }

      - name: Production refuses unauthenticated requests
        run: |
          docker run -d --name app-prod -p 127.0.0.1:8001:8000 \
            -e ENVIRONMENT=production \
            -e APP_SECRET_KEY=8m2WkS3vJ1nqv2kBv9jXf4dP0yq6m5pYJ3r9VQ7b0cE= \
            -e DATABASE_URL=sqlite:////tmp/ci.db -e RUN_JOBS=false \
            ecobee-manager:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8001/healthz >/dev/null && break; sleep 1; done
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8001/api/v1/thermostats)
          [ "$code" = "401" ] || { echo "expected 401, got $code"; docker logs app-prod; exit 1; }

      - name: Container logs
        if: always()
        run: docker logs app || true; docker logs app-prod || true

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to GHCR
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

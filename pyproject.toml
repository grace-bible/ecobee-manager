[project]
name = "ecobee-manager"
version = "0.1.0"
description = "Group, schedule and calendar-drive ecobee thermostats across GBC campuses"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "pydantic-settings>=2.7",
  "sqlalchemy>=2.0.30",
  "psycopg[binary]>=3.2",
  "apscheduler>=3.10,<4",
  # Pinned on purpose: this library drives ecobee's unofficial web login.
  # Bump deliberately and re-test login + MFA when ecobee changes.
  "python-ecobee-api==0.4.4",
  "pyotp>=2.9",
  "cryptography>=43",
  "pyjwt[crypto]>=2.9",
  "httpx>=0.27",
  "google-api-python-client>=2.140",
  "google-auth>=2.34",
  "alembic>=1.13",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["templates/*.html", "templates/partials/*.html", "static/*", "migrations/*", "migrations/versions/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# B008: FastAPI's Depends() in defaults is the intended pattern.
# BLE001: the two broad excepts keep one failing calendar/job from stopping the rest.
ignore = ["B008", "BLE001", "SIM115", "RUF046"]
